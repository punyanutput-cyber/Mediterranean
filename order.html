<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อ | Dame core</title>
  <meta name="description" content="สั่งซื้อสินค้า Dame core กรอกข้อมูลเพื่อยืนยันคำสั่งซื้อ">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Dame core</a>
      <nav aria-label="เมนูหลัก">
        <ul class="nav">
          <li><a href="product.html">สินค้า</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container container--narrow">
        <div class="section__head">
          <h1 class="page-title">สั่งซื้อ</h1>
        </div>

        <form id="orderForm" class="form">

          <div class="field">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" autocomplete="name" required>
          </div>

          <div class="field">
            <label for="contact">เบอร์โทร / Line</label>
            <input type="text" id="contact" name="contact" autocomplete="tel" required>
          </div>

          <div class="field">
            <label for="items">รายการสินค้า</label>
            <input type="text" id="items" name="items" required>
          </div>

          <div class="field">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input type="text" id="total" name="total" inputmode="decimal" required>
          </div>

          <div class="field">
            <label for="note">หมายเหตุ (ไม่บังคับ)</label>
            <textarea id="note" name="note"></textarea>
          </div>

          <div>
            <button type="submit" class="btn">ยืนยันสั่งซื้อ</button>
          </div>

        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Dame core</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
